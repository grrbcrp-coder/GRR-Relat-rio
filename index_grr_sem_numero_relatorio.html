<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRR | Grupo de Resposta Rápida</title>
<style>
:root{--navy:#101b35;--blue:#2463eb;--ink:#17243b;--muted:#718096;--line:#e4e9f1;--bg:#f3f6fb;--green:#16835d;--red:#c53b4a;--surface:#fff;--soft:#f8faff;--notice:#edf3ff;--notice-ink:#3157a4;--shadow:#14274b0c}
body.dark{--ink:#e5ebf5;--muted:#a4b1c5;--line:#33415a;--bg:#0b1220;--surface:#151f32;--soft:#101a2c;--notice:#1a2a49;--notice-ink:#b8ccff;--shadow:#0005}
body.dark h1,body.dark h2,body.dark .id,body.dark .stat strong{color:#edf3ff}
body.dark .btn{background:#1d2a40;color:#e5ebf5;border-color:#394963}body.dark .btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
body.dark input,body.dark select,body.dark textarea{background:#0f192b;color:#e5ebf5;border-color:#394963}body.dark th{background:#101a2c;color:#a4b1c5}body.dark td{border-color:#26344b}body.dark .num{background:#1d3156}body.dark .bar{background:#27364d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}
.top{background:linear-gradient(115deg,#101b35,#1b2e53);color:#fff;padding:17px max(18px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{border:1px solid #ffffff66;border-radius:12px;padding:10px;font-weight:900}
.shield-mark{width:46px;height:46px;display:grid;place-items:center;flex:0 0 46px;border:1px solid #ffffff38;border-radius:12px;background:#ffffff08;color:#e2bd58}
.shield-mark svg{width:31px;height:31px;display:block}
.brand{font-size:14px;font-weight:850;letter-spacing:.1em}.brand small{display:block;color:#b7c7e4;font-size:10px;letter-spacing:.16em}
.nav{display:flex;gap:5px;margin-left:auto}.nav button{background:transparent;color:#cbd6e9;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}
main{max-width:1120px;margin:auto;padding:28px 18px 50px}.head{display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap;margin-bottom:24px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.19em;color:var(--blue)}
h1{font-size:clamp(25px,3vw,34px);line-height:1.15;margin:5px 0;color:var(--navy);letter-spacing:-.04em}h2{font-size:17px;color:var(--navy);margin:0}.muted{color:var(--muted)}
.btn{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:750;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px var(--shadow);overflow:hidden}.stat{padding:17px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:27px;color:var(--navy);margin:8px 0}
.cardhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.cardbody{padding:20px}.search,input,select,textarea{border:1px solid #dce3ee;border-radius:9px;padding:10px 11px;font:inherit;max-width:100%}.search{min-width:220px}.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;text-align:left;color:#7a879c;background:var(--soft);padding:12px 15px}td{padding:13px 15px;border-top:1px solid #edf0f5;font-size:12px}.id{font-weight:850;color:var(--navy)}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:850;background:#fff3da;color:#986515}.approved{background:#e5f6ee;color:var(--green)}.blocked{background:#fee2e2;color:#991b1b}.rejected{background:#ffedd5;color:#9a3412}body.dark .blocked{background:#4b2028;color:#fecaca}body.dark .rejected{background:#4b3020;color:#fed7aa}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:800;color:#53627a}.field input,.field textarea{width:100%}.full{grid-column:1/-1}.section{grid-column:1/-1;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px}
.notice{padding:12px 14px;background:var(--notice);border-radius:9px;color:var(--notice-ink);margin-bottom:16px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.rank{display:grid;gap:10px}.rankitem{padding:14px;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px}.num{background:#eaf0ff;color:var(--blue);font-weight:900;border-radius:9px;padding:8px;text-align:center}.bar{height:7px;background:#eaf0f8;border-radius:8px;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue)}
.login{max-width:440px;margin:30px auto;padding:25px}.login .field{margin:13px 0}.login input{width:100%}.login .primary{width:100%}.foot{text-align:center;color:#8b97aa;font-size:10px;letter-spacing:.12em;padding:20px}.hidden{display:none}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:9px;margin:12px 0;white-space:pre-wrap}.success{background:#e5f6ee;color:#166534;padding:12px;border-radius:9px;margin:12px 0}.photo-link{display:inline-block;margin:4px 8px 4px 0}
@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:14px}.nav{order:3;width:100%;margin:0;overflow:auto}main{padding:20px 12px}.search{min-width:0;width:100%}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.full,.section{grid-column:auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.brand{font-size:11px}.rankitem{grid-template-columns:35px 1fr auto}}
</style>
</head>
<body>
<header class="top">
  <div class="shield-mark" aria-label="Escudo operacional GRR" title="GRR">
    <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
      <path d="M24 4 39 10v12c0 10-6.2 17.2-15 22C15.2 39.2 9 32 9 22V10L24 4Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M24 9 34 13v9c0 7-4.1 12.8-10 16.5C18.1 34.8 14 29 14 22v-9l10-4Z" fill="currentColor" opacity=".12"/>
      <path d="m18.5 23.5 3.8 3.8 7.7-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="brand">GRUPO DE RESPOSTA RÁPIDA<small>SISTEMA DE PATRULHAMENTO</small></div>
  <button class="btn" id="themeToggle" style="margin-left:auto" aria-label="Alternar tema" title="Alternar tema">☾</button>
  <div id="sessionArea" class="actions hidden"><span id="userLabel" style="align-self:center;color:#dbe7ff"></span><button class="btn" id="logoutBtn">Sair</button></div>
  <nav class="nav" id="mainNav"><button class="active" data-page="painel">Painel</button><button data-page="novo">Novo relatório</button><button data-page="ranking">Ranking</button><button data-page="admin">Administração / Login</button></nav>
</header>
<main id="app"><div class="card cardbody">Conectando ao Supabase…</div></main>
<div class="foot">GRR · GRUPO DE RESPOSTA RÁPIDA · SISTEMA DE RELATÓRIOS</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://ejbitjnetkiwtgesgkal.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_yz4zXaxPD4SAV90ZxIIWAw_qiDJnMUY';
const grrClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const BUCKET='grr-fotos';
let page='painel', isAdmin=false, editing=null, currentUser=null, reports=[], realtimeChannel=null, busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const fmt=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const stat=(a,b,c)=>`<div class="stat"><small>${a}</small><strong>${b}</strong><small>${c}</small></div>`;
function updateThemeIcon(){const dark=document.body.classList.contains('dark');const b=$('#themeToggle');if(b){b.textContent=dark?'☀':'☾';b.title=dark?'Ativar tema claro':'Ativar tema escuro';b.setAttribute('aria-label',b.title)}}
function toggleTheme(){document.body.classList.toggle('dark');try{localStorage.setItem('grr-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}updateThemeIcon()}
$('#themeToggle').addEventListener('click',toggleTheme);
try{if(localStorage.getItem('grr-theme')==='dark')document.body.classList.add('dark')}catch{}updateThemeIcon();
function showError(message){const old=$('#globalMessage');if(old)old.remove();const el=document.createElement('div');el.id='globalMessage';el.className='error';el.textContent=message;$('#app').prepend(el)}
function clearMessage(){const old=$('#globalMessage');if(old)old.remove()}
function head(k,t,s,button=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${s}</p></div>${button}</div>`}
function status(s){return `<span class="badge ${s==='aprovado'?'approved':s==='bloqueado'?'blocked':s==='recusado'?'rejected':''}">${esc((s||'rascunho').toUpperCase())}</span>`}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
$('#logoutBtn').addEventListener('click',async()=>{await grrClient.auth.signOut();});
function loginScreen(message=''){ $('#mainNav').classList.remove('hidden');$('#sessionArea').classList.add('hidden');$('#app').innerHTML=head('ACESSO ADMINISTRATIVO','GRR — Administração','Entre somente para acessar os controles administrativos.')+`<div class="card login"><div class="logo" style="background:#101b35;color:white;text-align:center;padding:14px">GRR</div><h2 style="text-align:center;margin:12px">LOGIN DO ADMINISTRADOR</h2><p class="muted">O painel, os relatórios e o ranking podem ser consultados sem login. A autenticação é exigida apenas para administrar.</p>${message?`<div class="error">${esc(message)}</div>`:''}<form id="loginForm"><div class="field"><label>E-mail</label><input name="email" type="email" autocomplete="username" required placeholder="E-mail administrativo"></div><div class="field"><label>Senha</label><input name="password" type="password" autocomplete="current-password" required placeholder="Senha"></div><button class="btn primary" id="loginButton" type="submit">Entrar</button></form></div>`;
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;const b=$('#loginButton');b.disabled=true;b.textContent='Entrando…';const fd=new FormData(f);const {error}=await grrClient.auth.signInWithPassword({email:String(fd.get('email')).trim(),password:String(fd.get('password'))});if(error){loginScreen('Não foi possível entrar: '+error.message)}b.disabled=false;});}
async function checkAdmin(){if(!currentUser)return false;const {data,error}=await grrClient.from('grr_admins').select('user_id').eq('user_id',currentUser.id).maybeSingle();if(error)console.warn('Não foi possível verificar o perfil administrativo:',error.message);return !!data}
async function loadReports(){const {data,error}=await grrClient.from('relatorios_grr').select('*').order('criado_em',{ascending:false});if(error){showError('Erro ao carregar relatórios: '+error.message+'\nConfira se as políticas RLS foram configuradas conforme as instruções.');return}reports=data||[];render()}
function startRealtime(){if(realtimeChannel)grrClient.removeChannel(realtimeChannel);realtimeChannel=grrClient.channel('grr-relatorios-live').on('postgres_changes',{event:'*',schema:'public',table:'relatorios_grr'},async()=>{await loadReports()}).subscribe((state)=>{if(state==='CHANNEL_ERROR')console.warn('Falha na conexão Realtime. Confira se a tabela está na publicação supabase_realtime.')})}
function setupSession(user){currentUser=user; if(!user){isAdmin=false;$('#sessionArea').classList.add('hidden');$('#mainNav').classList.remove('hidden');if(realtimeChannel){grrClient.removeChannel(realtimeChannel);realtimeChannel=null}return} $('#sessionArea').classList.remove('hidden');$('#mainNav').classList.remove('hidden');$('#userLabel').textContent=user.email||'Administrador';}
async function onSignedIn(user){setupSession(user);isAdmin=await checkAdmin();await loadReports();startRealtime();render()}
function nextId(){return `GRR-${new Date().getFullYear()}-${Date.now().toString().slice(-8)}`}
function table(rs,manage=false){if(!rs.length)return '<div class="cardbody muted">Nenhum relatório cadastrado ainda.</div>';return `<div class="tablewrap"><table><thead><tr><th>Registro</th><th>Data</th><th>Prefixo</th><th>Equipe operacional</th><th>Horário</th><th>Status / Motivo</th><th>Ação</th></tr></thead><tbody>${rs.map(r=>`<tr><td class="id">${esc(fmt(r.data))}</td><td>${fmt(r.data)}</td><td>${esc(r.prefixo)}</td><td>${esc([r.chefe,r.motorista,r.terceiro,r.quarto,r.quinto].filter(Boolean).join(' · ')||'—')}</td><td>${esc(r.inicio||'—')} – ${esc(r.fim||'—')}</td><td>${status(r.status)}${r.motivo_status?`<div class="muted" style="font-size:11px;margin-top:5px"><b>Motivo:</b> ${esc(r.motivo_status)}</div>`:''}</td><td><div class="actions">${manage?`<button class="btn" onclick="viewReport('${esc(r.id)}')">Detalhes</button><button class="btn" onclick="editReport('${esc(r.id)}')">Editar</button><button class="btn" onclick="setStatus('${esc(r.id)}','aprovado')">Aprovar</button><button class="btn" onclick="setStatus('${esc(r.id)}','recusado')">Recusar</button><button class="btn" onclick="setStatus('${esc(r.id)}','bloqueado')">Bloquear</button><button class="btn" onclick="deleteReport('${esc(r.id)}')">Excluir</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function panel(){const rs=reports;$('#app').innerHTML=head('VISÃO GERAL','Relatórios de Patrulhamento','Consulta pública dos registros de patrulhamento.',`<button class="btn primary" onclick="go('novo')">＋ Novo relatório</button>`)+`<section class="card"><div class="cardhead"><div><h2>Relatórios recentes</h2><small class="muted">Sincronizados pelo banco de dados</small></div><input class="search" id="q" placeholder="Buscar relatório..." oninput="filterTable()"></div><div id="table">${table(rs)}</div></section>`}
function filterTable(){const q=($('#q')?.value||'').toLowerCase();$('#table').innerHTML=table(reports.filter(r=>[r.id,r.prefixo,r.chefe,r.motorista,r.terceiro,r.quarto,r.quinto].some(v=>String(v??'').toLowerCase().includes(q))))}
function form(){const r=reports.find(x=>x.id===editing)||{};if(editing&&!isAdmin){showError('Somente administradores podem editar relatórios.');return}$('#app').innerHTML=head('REGISTRO DE SERVIÇO',editing?'Editar relatório':'Novo relatório de patrulhamento','Preencha os dados do serviço e os resultados da equipe.')+`<div class="notice">Os relatórios são públicos. A administração pode revisar e alterar o status após entrar com login administrativo.</div><form class="card" id="f"><input type="hidden" name="id" value="${esc(r.id||nextId())}"><div class="cardbody"><div class="grid"><div class="section">Identificação do serviço</div><div class="field"><label>Prefixo da viatura *</label><input name="prefixo" required value="${esc(r.prefixo)}" placeholder="GRR-01"></div><div class="field"><label>Data *</label><input type="date" name="data" required value="${esc(r.data||today())}"></div><div class="field"><label>Horário de início *</label><input type="time" name="inicio" required value="${esc(r.inicio)}"></div><div class="field"><label>Horário de término *</label><input type="time" name="fim" required value="${esc(r.fim)}"></div><div class="field"><label>Chefe de barca *</label><input name="chefe" required value="${esc(r.chefe)}" placeholder="Nome do integrante"></div><div class="field"><label>Motorista *</label><input name="motorista" required value="${esc(r.motorista)}" placeholder="Nome do integrante"></div><div class="field"><label>Terceiro Homem *</label><input name="terceiro" required value="${esc(r.terceiro)}" placeholder="Nome do integrante"></div><div class="field"><label>Quarto Homem *</label><input name="quarto" required value="${esc(r.quarto)}" placeholder="Nome do integrante"></div><div class="field"><label>Quinto Homem *</label><input name="quinto" required value="${esc(r.quinto)}" placeholder="Nome do integrante"></div><div class="section">Ocorrências e resultados</div>${[['presos','Presos'],['mortos','Mortos'],['bopm','BOPM / ocorrências'],['multas','Multas'],['veiculos','Veículos apreendidos'],['armas','Armas apreendidas'],['municoes','Munições apreendidas'],['drogas','Drogas apreendidas'],['materiais','Outros materiais']].map(([n,l])=>`<div class="field"><label>${l}</label><input type="number" min="0" step="1" name="${n}" value="${esc(r[n]??0)}"></div>`).join('')}<div class="section">Informações complementares</div><div class="field full"><label>Observações</label><textarea name="observacoes" rows="4">${esc(r.observacoes)}</textarea></div><div class="field full"><label>Fotos das apreensões</label><input name="fotos" type="file" accept="image/*" multiple><small class="muted">As fotos serão enviadas para o bucket privado grr-fotos no Supabase Storage. O limite depende das configurações do projeto Supabase.</small>${r.fotos?.length?`<small class="muted">Este relatório já possui ${r.fotos.length} foto(s) armazenada(s).</small>`:''}</div></div><div class="actions" style="justify-content:space-between;margin-top:22px"><button type="button" class="btn" onclick="editing=null;go('painel')">Cancelar</button><div class="actions"><button class="btn" type="button" onclick="saveForm('rascunho')">Salvar rascunho</button><button class="btn primary" id="submitReport" type="submit">Enviar relatório</button></div></div></div></form>`;
$('#f').onsubmit=e=>{e.preventDefault();saveForm('rascunho')}}
async function uploadPhotos(files,reportId,existing=[]){const paths=[...(existing||[])];for(const file of files){if(!file.type.startsWith('image/'))throw new Error('Um dos arquivos não é uma imagem.');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`public/${reportId}/${Date.now()}-${safe}`;const {error}=await grrClient.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;paths.push(path)}return paths}
async function saveForm(s){if(busy)return;const f=$('#f');if(!f.reportValidity())return;busy=true;const b=$('#submitReport');if(b){b.disabled=true;b.textContent='Salvando…'}clearMessage();try{const fd=new FormData(f);const id=String(fd.get('id')||editing||nextId());const existing=reports.find(x=>x.id===id);const files=Array.from(f.elements.fotos.files||[]);const photos=await uploadPhotos(files,id,existing?.fotos||[]);const row={id,prefixo:String(fd.get('prefixo')).trim(),data:String(fd.get('data')),inicio:fd.get('inicio')||null,fim:fd.get('fim')||null,chefe:String(fd.get('chefe')).trim(),motorista:String(fd.get('motorista')).trim(),terceiro:String(fd.get('terceiro')).trim(),quarto:String(fd.get('quarto')).trim(),quinto:String(fd.get('quinto')).trim(),presos:Number(fd.get('presos')||0),mortos:Number(fd.get('mortos')||0),bopm:Number(fd.get('bopm')||0),multas:Number(fd.get('multas')||0),veiculos:Number(fd.get('veiculos')||0),armas:Number(fd.get('armas')||0),municoes:Number(fd.get('municoes')||0),drogas:Number(fd.get('drogas')||0),materiais:Number(fd.get('materiais')||0),observacoes:String(fd.get('observacoes')||''),fotos:photos,status:existing?.status||s,atualizado_em:new Date().toISOString(),criado_por:existing?.criado_por||currentUser?.id||null};
let result;if(existing){if(!isAdmin)throw new Error('Somente administradores podem editar um relatório existente.');result=await grrClient.from('relatorios_grr').update(row).eq('id',id).select().single()}else{result=await grrClient.from('relatorios_grr').insert({...row,criado_em:new Date().toISOString()}).select().single()}if(result.error)throw result.error;editing=null;await loadReports();go('painel')}catch(err){showError('Não foi possível salvar o relatório: '+(err.message||String(err))+'\nVerifique as políticas SQL e se o bucket grr-fotos foi criado.')}finally{busy=false;if(b){b.disabled=false;b.textContent='Enviar relatório'}}}
function ranking(){
 const approved=reports.filter(r=>r.status==='aprovado');
 const fields=['chefe','motorista','terceiro','quarto','quinto'];
 const agents={};
 const hoursOf=r=>{if(!r.inicio||!r.fim)return 0;const toMin=s=>{const [h,m]=String(s).split(':').map(Number);return h*60+m};let mins=toMin(r.fim)-toMin(r.inicio);if(mins<0)mins+=1440;return mins/60};
 const totalResults=r=>['presos','mortos','bopm','multas','veiculos','armas','municoes','drogas','materiais'].reduce((sum,k)=>sum+Math.max(0,Number(r[k])||0),0);
 approved.forEach(r=>{
   const hours=hoursOf(r), results=totalResults(r);
   [...new Set(fields.map(k=>String(r[k]||'').trim()).filter(Boolean))].forEach(name=>{
     if(!agents[name])agents[name]={name,points:0,reports:0,hours:0,results:0};
     const a=agents[name];a.points+=results+1;a.reports++;a.hours+=hours;a.results+=results;
   });
 });
 const rows=Object.values(agents).sort((a,b)=>b.points-a.points||b.results-a.results||b.reports-a.reports||b.hours-a.hours||a.name.localeCompare(b.name));
 const fmtHours=n=>`${Math.floor(n)}h ${Math.round((n%1)*60)}min`;
 const max=Math.max(1,...rows.map(a=>a.points));
 $('#app').innerHTML=head('DESEMPENHO OPERACIONAL','Ranking de Patrulhamento','Um único ranking geral por agente, calculado apenas com relatórios aprovados.')+
 `<section class="card"><div class="cardhead"><h2>Ranking geral</h2><small class="muted">Todos os indicadores contam para a classificação</small></div><div class="cardbody">${rows.length?`<div class="rank">${rows.map((a,i)=>`<div class="rankitem"><div class="num">${i+1}</div><div><b>${esc(a.name)}</b><div class="bar"><span style="width:${Math.max(2,(a.points/max)*100)}%"></span></div><small class="muted">${a.reports} relatório(s) · ${fmtHours(a.hours)} · ${a.results} resultado(s) operacional(is)</small></div><b>${a.points} pts</b></div>`).join('')}</div>`:'<p class="muted">O ranking será preenchido quando houver relatórios aprovados.</p>'}</div></section>`;
}
function admin(){if(!currentUser){loginScreen();return}if(!isAdmin){$('#app').innerHTML=head('ACESSO RESTRITO','Administração','Apenas usuários cadastrados na tabela grr_admins podem administrar.')+`<div class="card cardbody"><p class="muted">Esta conta não possui perfil de administrador.</p><button class="btn" onclick="grrClient.auth.signOut()">Sair</button></div>`;return}$('#app').innerHTML=head('CENTRAL DE CONTROLE','Painel administrativo','Revise, aprove, recuse ou exclua relatórios.',`<span class="badge approved">ADMINISTRADOR</span>`)+`<div class="stats">${stat('Total',reports.length,'Relatórios')}${stat('Pendentes',reports.filter(r=>r.status==='rascunho').length,'Aguardando análise')}${stat('Aprovados',reports.filter(r=>r.status==='aprovado').length,'Validados')}${stat('Recusados',reports.filter(r=>r.status==='recusado').length,'Devolvidos')}</div><section class="card"><div class="cardhead"><h2>Gestão de relatórios</h2><input class="search" placeholder="Buscar..." id="aq" oninput="adminFilter()"></div><div id="atable">${table(reports,true)}</div></section>`}
function adminFilter(){const q=($('#aq')?.value||'').toLowerCase();$('#atable').innerHTML=table(reports.filter(r=>[r.id,r.prefixo,r.chefe,r.motorista,r.terceiro,r.quarto,r.quinto].some(v=>String(v??'').toLowerCase().includes(q))),true)}
async function setStatus(id,s){if(!isAdmin)return;let motivo=null;if(s==='recusado'||s==='bloqueado'){motivo=prompt(`Explique o motivo para ${s==='recusado'?'recusar':'bloquear'} este relatório. O motivo ficará visível aos agentes:`);if(motivo===null)return;motivo=motivo.trim();if(!motivo){alert('Informe o motivo antes de continuar.');return}}const patch={status:s,motivo_status:motivo,revisado_em:new Date().toISOString(),atualizado_em:new Date().toISOString()};const {error}=await grrClient.from('relatorios_grr').update(patch).eq('id',id);if(error){showError('Não foi possível alterar o status: '+error.message);return}await loadReports()}
async function deleteReport(id){if(!isAdmin||!confirm('Excluir este relatório? Esta ação não pode ser desfeita.'))return;const {error}=await grrClient.from('relatorios_grr').delete().eq('id',id);if(error){showError('Não foi possível excluir: '+error.message);return}await loadReports()}
function editReport(id){if(!isAdmin)return;editing=id;go('novo')}
async function viewReport(id){if(!isAdmin){showError('Somente administradores podem ver os detalhes completos do relatório.');return}const r=reports.find(x=>x.id===id);if(!r)return;const back=`<button class="btn" onclick="go('painel')">← Voltar</button>`;$('#app').innerHTML=head('DETALHES DO SERVIÇO',`Patrulhamento · ${fmt(r.data)}`,`Prefixo ${esc(r.prefixo)}`,back)+`<section class="card"><div class="cardhead"><h2>Resumo do patrulhamento</h2>${status(r.status)}</div><div class="cardbody"><div class="grid">${[['Data',fmt(r.data)],['Prefixo',r.prefixo],['Chefe de barca',r.chefe],['Motorista',r.motorista],['Terceiro Homem',r.terceiro],['Quarto Homem',r.quarto],['Quinto Homem',r.quinto],['Início',r.inicio],['Término',r.fim],['Presos',r.presos],['Mortos',r.mortos],['BOPM',r.bopm],['Multas',r.multas],['Veículos',r.veiculos],['Armas',r.armas],['Munições',r.municoes],['Drogas',r.drogas],['Materiais',r.materiais]].map(([k,v])=>`<div><div class="eyebrow">${k}</div><b>${esc(v??'—')}</b></div>`).join('')}<div class="field full"><label>Observações</label><p>${esc(r.observacoes||'—')}</p></div><div class="field full"><label>Motivo da recusa/bloqueio</label><p>${esc(r.motivo_status||'—')}</p></div><div class="field full"><label>Fotos</label><div id="photoList" class="muted">Carregando fotos…</div></div></div></div></section>`;
const holder=$('#photoList');if(!r.fotos?.length){holder.textContent='Nenhuma foto anexada.';return}const links=[];for(const path of r.fotos){const {data,error}=await grrClient.storage.from(BUCKET).createSignedUrl(path,300);if(!error&&data?.signedUrl)links.push(`<a class="photo-link" href="${esc(data.signedUrl)}" target="_blank" rel="noopener">Abrir foto</a>`)}holder.innerHTML=links.join('')||'Não foi possível abrir as fotos. Confira as permissões do Storage.'}
function render(){clearMessage();if(page==='painel')panel();else if(page==='novo')form();else if(page==='ranking')ranking();else admin()}
grrClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){setupSession(null);page='painel';loadReports();return}if(session?.user&&(event==='SIGNED_IN'||event==='INITIAL_SESSION'||event==='TOKEN_REFRESHED')){setTimeout(()=>onSignedIn(session.user),0)}});
(async()=>{const {data:{session},error}=await grrClient.auth.getSession();if(error){showError('Erro ao verificar sessão: '+error.message);setupSession(null);await loadReports();return}if(session?.user)await onSignedIn(session.user);else{setupSession(null);await loadReports();startRealtime();render()}})();
</script>
</body>
</html>
